name: "Retell — web call voice agent test"
description: >
  Test a Retell AI voice agent via web call.
  Creates a web call through the Retell API, streams audio over WebSocket,
  and evaluates the agent's responses.

transport:
  type: retell
  mode: web_call
  config:
    api_key: "${RETELL_API_KEY}"
    agent_id: "${RETELL_AGENT_ID}"

audio:
  tts_provider: edge
  stt_provider: whisper
  sample_rate: 16000

turns:
  - user: "Hello, I'd like some information please."
    expect:
      - type: latency
        max_first_byte_ms: 3000
      - type: turn_count
        min_words: 3

  - user: "Can you tell me about your return policy?"
    expect:
      - type: latency
        max_first_byte_ms: 3000
      - type: turn_count
        min_words: 5
      - type: keyword
        forbidden: ["error", "undefined", "null"]

settings:
  turn_timeout: 15.0
  silence_threshold: 1.5
