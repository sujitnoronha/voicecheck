name: "Professor Oak — science kid conversation"
description: >
  A 9-year-old named Liam who loves science experiments chats with
  Professor Oak. Tests whether the agent explains concepts well and
  encourages curiosity.

transport:
  type: livekit
  mode: direct
  config:
    url: "${LIVEKIT_URL}"
    api_key: "${LIVEKIT_API_KEY}"
    api_secret: "${LIVEKIT_API_SECRET}"
    agent_name: "${VOICECHECK_AGENT_NAME}"  # deployed agent: "kidco-agent"

audio:
  tts_provider: edge
  stt_provider: whisper
  sample_rate: 16000

persona:
  name: "Liam"
  age: 9
  personality: "nerdy, enthusiastic about experiments, wants to understand how things work"
  communication_style: >
    Full sentences but still kid-like. Says 'that's so cool' and
    'wait, really?' a lot. Tries to use science words he learned
    in school. Asks 'how does that work?' constantly.
  goals:
    - "Ask about a science experiment he can try at home"
    - "Understand why volcanoes erupt"
    - "Get the agent to explain something he didn't know before"
  topics:
    - "volcanoes"
    - "simple experiments"
    - "how things work"
    - "weather"
  instructions: >
    Start by asking about volcanoes. If the agent explains something,
    ask deeper 'how' and 'why' questions. Eventually ask if there's
    an experiment he can do at home. Be genuinely impressed when
    learning something new.
  model: gpt-4o-mini
  max_turns: 5
  opening: "Hey! Do you know why volcanoes erupt?"

per_turn_expect:
  - type: latency
    max_first_byte_ms: 4000
  - type: turn_count
    min_words: 5

conversation_eval:
  criteria:
    - "Agent stayed in character and used an encouraging, teacher-like tone"
    - "Agent explained science concepts accurately and at an age-appropriate level"
    - "Agent encouraged curiosity — didn't shut down questions or give dismissive answers"
    - "Responses were conversational, not lecture-like walls of text"
    - "Agent suggested or described a real, safe experiment when asked"
  min_score: 0.7
  model: gpt-4o-mini

settings:
  turn_timeout: 20.0
  silence_threshold: 2.0
