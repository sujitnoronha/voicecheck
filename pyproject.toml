[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicecheck"
version = "0.2.0"
description = "E2E testing framework for voice agents — tests the full audio loop"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["voice", "agent", "testing", "livekit", "vapi", "retell", "pipecat", "daily", "telephony", "e2e", "quality"]
authors = [{ name = "Sujit Noronha" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
livekit = ["livekit>=1.0.0", "livekit-api>=1.0.0"]
daily = ["daily-python>=0.10.0"]
vapi = ["websockets>=12.0", "httpx>=0.27"]
retell = ["websockets>=12.0", "httpx>=0.27"]
tts = [
    "edge-tts>=6.1",
    "pydub>=0.25",
    # Python 3.13 removed `audioop` from stdlib (PEP 594). pydub still imports it.
    # audioop-lts is the community-maintained backport.
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]
stt = ["faster-whisper>=1.0"]
llm = ["openai>=1.0", "anthropic>=0.30"]
dashboard = ["fastapi>=0.111", "uvicorn[standard]>=0.29", "jinja2>=3.1"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
all = ["voicecheck[livekit,daily,vapi,retell,tts,stt,llm,dashboard,otel]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/sujitnoronha/voicecheck"
Repository = "https://github.com/sujitnoronha/voicecheck"
Issues = "https://github.com/sujitnoronha/voicecheck/issues"
Changelog = "https://github.com/sujitnoronha/voicecheck/blob/main/CHANGELOG.md"

[project.scripts]
voicecheck = "voicecheck.cli:main"

[project.entry-points.pytest11]
voicecheck = "voicecheck.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/voicecheck"]
artifacts = ["voicecheck.schema.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",    # line length (handled by formatter)
    "B904",    # raise-without-from-err inside except — intentional in many sites
    "B027",    # empty method in ABC without @abstractmethod — optional-override hooks
    "B017",    # broad Exception in pytest.raises — acceptable for parse-guard tests
    "B023",    # function-uses-loop-variable — false positives for async closures inside if
]

[tool.ruff.lint.isort]
known-first-party = ["voicecheck"]
